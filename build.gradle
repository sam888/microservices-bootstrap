plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'

    // uncomment this when using git
    id "com.gorylenko.gradle-git-properties" version "2.5.2"  // Generate git Info at /actuator/info

    id "com.google.osdetector" version "1.7.3" // Detect OS
    id 'org.graalvm.buildtools.native' version '0.10.6'  // ✅ add this
}

// Uncomment this and 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml' below for parsing xml
//
// dependencyManagement {
//    imports {
//        mavenBom "com.fasterxml.jackson:jackson-bom:2.18.2"
//    }
// }


group = 'com.microservices.bootstrap'
version = '0.0.2'

// https://spring.io/blog/2023/09/09/all-together-now-spring-boot-3-2-graalvm-native-images-java-21-and-virtual
/*
java {
    sourceCompatibility = '21'
    toolchain {languageVersion = JavaLanguageVersion.of( 21 ) }
}
*/

compileJava {
    options.encoding = 'UTF-8'
    options.deprecation = true  // Show deprecated details
    options.release = 17
}

repositories {
    mavenCentral()
}


jar {
    archiveFileName = 'microservices-bootstrap.jar' // https://docs.gradle.org/current/dsl/org.gradle.api.tasks.bundling.Jar.html
    // https://docs.gradle.org/current/dsl/org.gradle.api.tasks.bundling.Jar.html
    manifest {
        attributes 'Main-Class': 'com.microservices.bootstrap.MainApplication'
    }
}

graalvmNative {
    toolchainDetection = false  // ✅ add this - use JAVA_HOME instead of auto-detect
    binaries {
        main {
            imageName = 'microservices-bootstrap'         // output binary name
            mainClass = 'com.microservices.bootstrap.MainApplication'
            buildArgs.add('--no-fallback')  // fail if native not possible

            // Fix build error like:
            //   Error: Classes that should be initialized at run time got initialized during image building:
            //   org.apache.commons.logging.LogFactory was unintentionally initialized at build time
            buildArgs.add('--initialize-at-build-time=org.apache.commons.logging.LogFactory')

            buildArgs.add('--initialize-at-run-time=ch.qos.logback,org.apache.logging.log4j,org.slf4j,org.apache.commons.logging.impl.Jdk14Logger')
            buildArgs.add('--initialize-at-run-time=org.springframework.data.repository.util.QueryExecutionConverters,org.springframework.data.util.CustomCollections')

            // Uncomment to trace what triggers ch.qos.logback.classic.Logger's static init during nativeCompile — useful when
            // the build fails with "Classes that should be initialized at run time got initialized during image building".
            // In this project it traced back to Spring Data's QueryExecutionConverters, fixed via:
            //      buildArgs.add('--initialize-at-run-time=org.springframework.data.repository.util.QueryExecutionConverters,org.springframework.data.util.CustomCollections')
            // (Note: other classes can trigger the same conflict via different paths — repeat with a different class name
            // from the error message if this doesn't fully resolve it.)
            //
            // buildArgs.add('--trace-class-initialization=ch.qos.logback.classic.Logger')   // ← temporary, remove after diagnosing

            buildArgs.add('-H:+ReportExceptionStackTraces')
            buildArgs.add('-H:+ReportUnsupportedElementsAtRuntime')

            // Explicitly forces GraalVM to include the missing AOT classes folder.
            classpath(sourceSets.aot.output.classesDirs)

            // Always use fast build locally. The valid optimize options for GraalVM 17 are:
            // Flag    Meaning
            // -O0No   optimizations (fastest build, good for dev)
            // -O1     Basic optimizations
            // -O2     Default -> the default when no flag is specified, exactly what's used for production
            // -Ob     Optimize for fastest build time. ~43% build speedup according to Oracle benchmark
            if (project.hasProperty('localDev')) {
                buildArgs.add('-Ob')  // Usage: ./gradlew nativeCompile -PlocalDev
            }
        }
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    all {
        exclude group: 'commons-logging', module: 'commons-logging'
    }

}

springBoot {
    buildInfo() // Same as executing build-info goal of Spring Boot Maven Plugin, i.e. artifactId spring-boot-maven-plugin
}


tasks.named('bootJar') {
    launchScript()
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
}

tasks.register('runNative', Exec) {
    commandLine "./build/native/nativeCompile/microservices-bootstrap"
}


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-freemarker'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // https://docs.spring.io/spring-boot/docs/current/reference/html/configuration-metadata.html
    // Only required when using @ConfigurationProperties
    // annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    // For sending email
    implementation 'org.springframework:spring-context-support'
    implementation 'org.springframework.boot:spring-boot-starter-mail'


    // Validate email address
    implementation 'commons-validator:commons-validator:1.9.0'

    implementation 'org.apache.commons:commons-lang3:3.13.0'
    implementation group: 'com.auth0', name: 'java-jwt', version: '4.5.0'
    implementation group: 'commons-codec', name: 'commons-codec', version: '1.16.0'

    // implementation 'net.lingala.zip4j:zip4j:2.11.5'                            // Zipping file
    // implementation 'com.pivovarit:throwing-function:1.5.1'                     // Throw exception within lambda
    // implementation group: 'org.passay', name: 'passay', version: '1.6.2'       // Enforcing password rules
    // implementation 'org.apache.commons:commons-text:1.10.0'
    // implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'   // Parsing XML

    implementation 'org.springframework.boot:spring-boot-starter-cache'  // Cache abstraction (@Cacheable / @CacheEvict)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis' // Redis

    // resilience4j Circuit Breaker
    implementation('io.github.resilience4j:resilience4j-spring-boot3:2.4.0') {
        exclude group: 'org.apache.logging.log4j'
    }
    implementation 'io.github.resilience4j:resilience4j-reactor:2.4.0'

    compileOnly 'org.projectlombok:lombok'
    testImplementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    compileOnly("org.springframework.boot:spring-boot-devtools")


    // Mock test
    // implementation 'com.squareup.okhttp3:mockwebserver'

    // Spring boot and Reactor tests
    testImplementation('org.springframework.boot:spring-boot-starter-test')  {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    // testImplementation 'org.springframework.security:spring-security-test'
    // testImplementation 'io.projectreactor:reactor-test'

    // JUnit 5, update to latest as required
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

// https://docs.gradle.org/current/userguide/java_testing.html

// Disables the test task every time a build is run
tasks.named('test') {
    enabled = false
}

